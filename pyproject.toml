[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-prakash"
version = "1.0.0"
description = "TLS/certificate inspector: chain, expiry, protocol and version probing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sushanth Kasturi" }]
keywords = ["tls", "ssl", "certificate", "security", "expiry", "x509"]

[project.scripts]
lumen-prakash = "lumen_prakash.__main__:main"

[tool.setuptools]
packages = ["lumen_prakash"]
